<!doctype html>
<!-- Rendered by scripts/readme-screenshots.mjs using the actual component. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii-tabs README screenshots</title>
<script type="module" src="../../ascii-tabs.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .capture { box-sizing: border-box; width: 760px; padding: 24px; background: #fdfaf5; color: #1a1a1a; }
  .capture[data-theme="dark"] { background: #1b1a18; color: #f1ede4; }
  h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
  ascii-tabs + h2 { margin-top: 24px; }
  #melody { --ascii-tabs-font-size: 20px; }
</style>
</head>
<body>
<section class="capture" id="editor">
  <h2>Write, copy and organize guitar tabs</h2>
  <ascii-tabs id="melody"></ascii-tabs>
</section>
<section class="capture" id="notation">
  <h2>Note names and adjustable spacing</h2>
  <ascii-tabs id="letters" notation="letters" labels="notes" readonly>
    <ascii-tabs-notation></ascii-tabs-notation>
    <ascii-tabs-spacing></ascii-tabs-spacing>
    <ascii-tabs-sheet><ascii-tabs-copy></ascii-tabs-copy></ascii-tabs-sheet>
  </ascii-tabs>
  <h2>Solfege with a Spanish interface</h2>
  <ascii-tabs id="solfege" notation="solfege" lang="es" labels="notes" readonly>
    <ascii-tabs-notation></ascii-tabs-notation>
    <ascii-tabs-sheet><ascii-tabs-copy></ascii-tabs-copy></ascii-tabs-sheet>
  </ascii-tabs>
</section>
<section class="capture" id="styles">
  <h2>Per-note colors, bold and parentheses</h2>
  <ascii-tabs id="styled" labels="notes"></ascii-tabs>
</section>
<section class="capture" id="initial">
  <h2>Render structured data as a guitar tab</h2>
  <ascii-tabs id="data"></ascii-tabs>
</section>
<script type="module">
  await customElements.whenDefined('ascii-tabs');
  const theme = new URLSearchParams(location.search).get('theme') || 'light';
  document.querySelectorAll('.capture').forEach(el => el.dataset.theme = theme);
  document.querySelectorAll('ascii-tabs').forEach(el => el.setAttribute('theme', theme));
  const melody = [0, 0, 1, 3, 3, 1, 0, null, null, null, null, 0, 0, null, null].map(
    (fret, i) => [fret, ({ 7: 3, 8: 1, 9: 1, 10: 3, 13: 3, 14: 3 })[i] ?? null, null, null, null, null]
  );
  document.querySelector('#melody').value = [melody];
  const scale = [0, 2, 3, 5, 7, 8, 10, 12].map(fret => [fret, null, null, null, null, null]);
  document.querySelector('#letters').value = [scale];
  document.querySelector('#solfege').value = [scale];
  document.querySelector('#styled').value = [[
    [{ fret: 0, color: '#b91c1c', bold: true }, null, null, null, 3, null],
    [{ fret: 2, color: '#b91c1c', bold: true }, null, null, 2, null, null],
    [{ fret: 3, color: 'royalblue', bold: true }, null, 0, null, null, null],
    [{ fret: 5, bold: false }, null, null, null, 2, null],
    [{ fret: 7, color: 'royalblue', parenthesized: true }, null, null, 0, null, null],
    [{ fret: 5, bold: false, parenthesized: true }, null, 0, null, null, null],
  ]];
  document.querySelector('#data').value = [[
    [null, null, 2, null, 0, null],
    [null, null, null, 2, null, null],
    [null, 3, null, null, null, null],
    [null, null, 2, null, 0, null],
  ]];
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
